# BrainTome Configuration File

# Data Configuration
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  train_split: 0.8
  val_split: 0.2
  patch_size: [64, 64, 64]
  resize_to: [128, 128, 128]
  modalities: ["t1n", "t1c", "t2w", "t2f"]

# Model Configuration
model:
  name: "UNet3D"
  in_channels: 4
  out_channels: 1
  base_filters: 32
  depth: 3
  dropout: 0.1

# Training Configuration
training:
  epochs: 10
  batch_size: 4
  learning_rate: 1e-4
  optimizer: "adam"
  scheduler: "cosine"
  weight_decay: 1e-5
  early_stopping_patience: 5
  save_best_only: true

# Inference Configuration
inference:
  threshold: 0.5
  tta: false  # Test Time Augmentation
  overlap: 0.5  # Patch overlap for sliding window

# Hardware Configuration
hardware:
  device: "auto"  # auto, cuda, cpu, mps
  num_workers: 4
  pin_memory: true
  mixed_precision: false

# Logging Configuration
logging:
  log_dir: "logs"
  log_level: "INFO"
  save_frequency: 1  # Save model every N epochs
  
# Visualization Configuration
visualization:
  save_samples: true
  sample_frequency: 2  # Save samples every N epochs
  num_samples: 4